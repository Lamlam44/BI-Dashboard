services:
  - type: web
    name: bi-dashboard-api
    runtime: python
    pythonVersion: 3.11
    startCommand: "cd backend && pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"

    # Database configuration from TiDB Cloud
    envVars:
      - key: DB_HOST
        value: "gateway01.ap-southeast-1.prod.aws.tidbcloud.com"
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        fromDatabase:
          name: default
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: default
          property: password
      - key: DB_NAME
        value: "retails_dataset"
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_PORT
        value: "8000"
      - key: CACHE_TTL
        value: "600"
      - key: ANALYTICS_CACHE_TTL
        value: "900"
      - key: INGEST_API_KEY
        sync: false
      - key: SSL_CA_PATH
        value: "/etc/ssl/certs/ca-certificates.crt"

    # Mount volume for data if needed
    disk:
      - name: etl_cache
        path: /backend/modules/demand_forecasting/cache

    # Auto-deploy on git push
    deploy:
      triggers:
        - type: github
          ref: refs/heads/main

    # Scaling and health
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 85

    # Health check
    healthCheck:
      path: /
      initialDelaySeconds: 30
